# アバター生成プロンプトのプリセット集（プロパティ先行：この段階では属性だけを決め、画像の描画は後段の処理で行う）
# 共通制約：服装は節度と清潔感のあるデザインに限る。ビキニ等の露出の多い服は絶対に不可。アロハシャツは爽やかで清潔なため可。
# 制服はクラスごとに統一（執事服／メイド服／じいや服／ばあや服／飛丸は忍者装束）し、プリセットは意匠のテーマ・色・素材・髪や瞳の傾向を決める。
avatar_presets:
  - id: "omakase"
    name: "おまかせ"
    summary: "テーマも配色も完全ランダム、運に任せる一択"
    prompt: "使用人は、テーマも配色も完全ランダムに決めるおまかせ仕様で、制服のクラス統一だけは守り、男性と女性で色の系統が自然に分かれるようにし、ただし忍者（飛丸）だけはどんなテーマでも忍者装束を崩さず、全体的に若く溌剌としつつじいやとばあやは年配らしく、髪色と瞳の色はバラエティ豊かに散らして、ヘアスタイルはよきにはからって"
  - id: "ninja-gundan"
    name: "忍者軍団"
    summary: "全員が忍び装束風の意匠で統一された隠密集団"
    prompt: "使用人は、全員が忍びの里の装束を意匠にしたデザインで、男性は藍色と墨色、女性は紫紺と深紅を基調にし、ただし忍者（飛丸）は頭領らしく漆黒に銀の意匠を効かせ、全体的に若く機敏な印象で、髪は黒髪を基調に銀髪や茶髪を混ぜ、瞳は黒、茶、琥珀など鋭い色合いにし、ヘアスタイルはよきにはからって"
  - id: "samurai"
    name: "サムライ"
    summary: "武家屋敷の家臣団、袴と刀帯を思わせる凛とした意匠"
    prompt: "使用人は、武家屋敷に仕える家臣団をイメージした袴風の意匠のデザインで、男性は紺と鉄紺、女性は臙脂と藤色を基調にし、ただし忍者（飛丸）は武士に紛れる町人風ではなく正統な忍者装束とし、全体的に若く凛々しく、髪は黒髪と焦げ茶を基調に端正にまとめ、瞳は黒、深茶、灰など意志の強い色合いにし、ヘアスタイルはよきにはからって"
  - id: "yoroleihi"
    name: "ヨーロレイヒー"
    summary: "アルプスの山岳地方、チロル風の毛織物と刺繍の温かみ"
    prompt: "使用人は、アルプスの山岳地方を思わせるチロル風のデザインで、毛織物のベストや刺繍、革の帯を意匠に取り入れ、男性は森林の緑と茶、女性は深紅とクリーム色を基調にし、ただし忍者（飛丸）は山岳猟師風に溶け込む忍者装束とし、全体的に若く健康的な印象で、髪は金髪と亜麻色を基調に、瞳は青、緑、ヘーゼルなど澄んだ色合いにし、ヘアスタイルはよきにはからって"
  - id: "western-fantasy"
    name: "西洋ファンタジー"
    summary: "王道の中世ファンタジー王宮、騎士と宮廷のオーソドックスな世界"
    prompt: "使用人は、中世ヨーロッパの王宮を舞台にした王道ファンタジーのデザインで、男性は深青と銀、女性は白銀と淡い青紫を基調にし、ただし忍者（飛丸）は影の斥候らしい暗色の忍者装束とし、全体的に若く気品があり、髪は金髪、銀髪、栗色を散らし、瞳は青、緑、紫など宝石のような色合いにし、ヘアスタイルはよきにはからって"
  - id: "ancient-egypt"
    name: "古代エジプト"
    summary: "ナイルの王宮、黄金とラピスラズリ、亜麻布の古代文明"
    prompt: "使用人は、古代エジプトの王宮をイメージしたデザインで、白い亜麻布に黄金とラピスラズリの装飾を効かせ、男性は白と金にターコイズ、女性は白と金に深い青を基調にし、ただし忍者（飛丸）は夜の砂漠に溶ける砂色と黒の忍者装束とし、全体的に若く日差しに映える印象で、髪は黒髪を基調に、瞳は黒、焦げ茶、金茶など強い色合いにし、ヘアスタイルはよきにはからって"
  - id: "ancient-near-east"
    name: "古代近東"
    summary: "旧約聖書の時代のユダヤの町、素朴な織物と土色の世界"
    prompt: "使用人は、旧約聖書の時代のユダヤの町をイメージしたデザインで、素朴な織物の縞模様と土色、オリーブ色を意匠に取り入れ、男性は生成りと茶、女性は生成りと深い臙脂を基調にし、ただし忍者（飛丸）は旅人に紛れる素朴な色合いの忍者装束とし、全体的に若く素朴で温かく、髪は黒髪と濃い茶を基調に、瞳は黒と深茶など落ち着いた色合いにし、ヘアスタイルはよきにはからって"
  - id: "wafuku-arrange"
    name: "和風着物アレンジ"
    summary: "着物を意匠にした和装アレンジ、西洋風の顔立ちとの対比が映える"
    prompt: "使用人は、和風な日本の着物をイメージしたデザインで、男性はダークブルー、女性はシックレッドを基調にし、ただし忍者（飛丸）だけは漆黒のメカな忍者装束とし、全体的に若く、何故か全員西洋風で金髪や銀髪を散らし、瞳は赤、緑、青など鮮やかな色合いにし、ヘアスタイルはよきにはからって"
  - id: "victorian"
    name: "ヴィクトリアン"
    summary: "19世紀英国の貴族邸、レースと深い色合いの正統派クラシック"
    prompt: "使用人は、19世紀英国の貴族邸をイメージしたヴィクトリアンなデザインで、レースとフリル、深みのある色使いを意匠に取り入れ、男性は黒と深緑、女性はボルドーと黒を基調にし、ただし忍者（飛丸）は屋根裏を渡る影らしく黒一色の忍者装束とし、全体的に若く上品で、髪は栗色、金髪、黒髪を上品にまとめ、瞳は灰、青、深緑など知的な色合いにし、ヘアスタイルはよきにはからって"
  - id: "steampunk"
    name: "スチームパンク"
    summary: "蒸気機関と歯車の工房都市、ゴーグルと真鍮の冒険心"
    prompt: "使用人は、蒸気機関と歯車の工房都市をイメージしたスチームパンクなデザインで、革と真鍮、ゴーグルを意匠に取り入れ、男性は茶と銅色、女性は焦げ茶と深紅を基調にし、ただし忍者（飛丸）は蒸気仕掛けを忍び道具に変えた忍者装束とし、全体的に若く冒険心に満ち、髪は茶髪と赤毛を基調に、瞳は茶、琥珀、緑など温かい色合いにし、ヘアスタイルはよきにはからって"
  - id: "taisho-roman"
    name: "大正ロマン"
    summary: "大正時代のモダンな華やぎ、矢絣とブーツのハイカラな世界"
    prompt: "使用人は、大正時代の華やかなモダニズムをイメージしたデザインで、矢絣や市松などの和柄に洋風の小物を意匠に取り入れ、男性は海老茶と紺、女性は紫と臙脂を基調にし、ただし忍者（飛丸）は大正の闇に紛れる濃紺の忍者装束とし、全体的に若くハイカラな印象で、髪は黒髪を基調に内巻きや編み込みを散らし、瞳は黒、茶、紫がかった色合いにし、ヘアスタイルはよきにはからって"
  - id: "showa-retro"
    name: "昭和レトロ"
    summary: "昭和の洋館と喫茶店、懐かしく温かいレトロモダン"
    prompt: "使用人は、昭和の洋館や喫茶店をイメージしたレトロモダンなデザインで、懐かしい配色と素朴な柄を意匠に取り入れ、男性はベージュと茶、女性は若草色と小豆色を基調にし、ただし忍者（飛丸）は昭和の影絵のような黒の忍者装束とし、全体的に若く温かな印象で、髪は黒髪と茶髪を柔らかくまとめ、瞳は黒と茶など優しい色合いにし、ヘアスタイルはよきにはからって"
  - id: "wa-modern"
    name: "和モダン"
    summary: "現代的な和のミニマル意匠、直線と余白の洗練"
    prompt: "使用人は、現代的に再構成した和の意匠のデザインで、直線的な裁断と余白、無地に近い色面を活かし、男性は墨色と藍、女性は白と朱を基調にし、ただし忍者（飛丸）は現代素材のマットな黒の忍者装束とし、全体的に若く洗練された印象で、髪は黒髪と銀髪を対比させ、瞳は黒、灰、深青など静かな色合いにし、ヘアスタイルはよきにはからって"
  - id: "chinese-palace"
    name: "中華宮廷"
    summary: "絹と刺繍の中華宮廷、龍鳳の紋様と鮮やかな色彩"
    prompt: "使用人は、中華の宮廷をイメージしたデザインで、絹地に龍や鳳凰、花の刺繍を意匠に取り入れ、男性は深青と金、女性は真紅と金を基調にし、ただし忍者（飛丸）は夜の宮廷に紛れる黒と深緑の忍者装束とし、全体的に若く華やかで、髪は黒髪を基調に艶やかにまとめ、瞳は黒、焦げ茶、赤茶など艶のある色合いにし、ヘアスタイルはよきにはからって"
  - id: "indian-court"
    name: "インド宮廷"
    summary: "マハラジャの宮殿、宝石色の絹と金の刺繍の絢爛"
    prompt: "使用人は、インドの宮廷をイメージしたデザインで、宝石のような色の絹と金の刺繍、ターバン風の意匠を取り入れ、男性は深紫と金、女性はマゼンタと金を基調にし、ただし忍者（飛丸）は夜のバザールに溶ける深い藍の忍者装束とし、全体的に若く絢爛な印象で、髪は黒髪を基調に豊かな量感でまとめ、瞳は黒と濃茶など強い色合いにし、ヘアスタイルはよきにはからって"
  - id: "nordic"
    name: "北欧"
    summary: "フィヨルドと森の北欧、ウールと革、澄んだ空気の素朴さ"
    prompt: "使用人は、北欧の森とフィヨルドをイメージしたデザインで、ウールと革、幾何学模様の織りを意匠に取り入れ、男性は灰青と茶、女性は深紅と生成りを基調にし、ただし忍者（飛丸）は雪原と針葉樹林に紛れる白灰と濃緑の忍者装束とし、全体的に若く健やかな印象で、髪は金髪と白金、明るい茶を散らし、瞳は青と灰、緑など澄んだ色合いにし、ヘアスタイルはよきにはからって"
  - id: "celtic"
    name: "ケルト"
    summary: "霧の島々のケルト、結び目紋様と深い緑の神秘"
    prompt: "使用人は、ケルトの霧深い島々をイメージしたデザインで、結び目紋様と格子柄の織物、金属の環飾りを意匠に取り入れ、男性は深緑と茶、女性は深緑と銅色を基調にし、ただし忍者（飛丸）は森の霧に同化する苔色と黒の忍者装束とし、全体的に若く神秘的な印象で、髪は赤毛と金髪、栗色を散らし、瞳は緑、灰、ヘーゼルなど森の色合いにし、ヘアスタイルはよきにはからって"
  - id: "arabian-nights"
    name: "アラビアンナイト"
    summary: "千夜一夜の宮殿、真珠と深い青、砂漠の夜の物語"
    prompt: "使用人は、アラビアンナイトの宮殿をイメージしたデザインで、透けない重ね布と金の飾り紐、真珠の装飾を意匠に取り入れ、男性は深青と白、女性は紫と金を基調にし、ただし忍者（飛丸）は砂漠の夜に溶ける黒と砂色の忍者装束とし、全体的に若く物語めいた印象で、髪は黒髪を基調に豊かに流し、瞳は黒、濃茶、金茶など夜に映える色合いにし、ヘアスタイルはよきにはからって"
  - id: "baroque"
    name: "バロック宮廷"
    summary: "豪壮なバロック宮廷、金糸と深紅の劇的な華やかさ"
    prompt: "使用人は、バロック様式の宮廷をイメージしたデザインで、金糸の刺繍と大きな襟飾り、劇的な色対比を意匠に取り入れ、男性は深紅と金、女性は黒と金を基調にし、ただし忍者（飛丸）は宮廷の影らしく黒に金の忍者装束とし、全体的に若く堂々とした印象で、髪は栗色と金髪を豊かに巻き、瞳は茶、青、深緑など重厚な色合いにし、ヘアスタイルはよきにはからって"
  - id: "rococo"
    name: "ロココ"
    summary: "淡く優美なロココ、パステルと花模様の宮廷サロン"
    prompt: "使用人は、ロココ様式の優美なサロンをイメージしたデザインで、パステルカラーと花模様、繊細なレースを意匠に取り入れ、男性は淡青と白、女性は淡桃と白を基調にし、ただし忍者（飛丸）は庭園の影に紛れる淡灰と黒の忍者装束とし、全体的に若く柔らかな印象で、髪は金髪と淡い栗色をふんわりとまとめ、瞳は青、紫、灰など淡い色合いにし、ヘアスタイルはよきにはからって"
  - id: "pirate"
    name: "海賊キャプテン"
    summary: "大海原の船乗り、節度ある船長服と海の冒険心"
    prompt: "使用人は、大海原を駆ける船乗りをイメージしたデザインで、ロングコート風の上着と革ベルト、航海図のような紋様を意匠に取り入れ、男性は紺と茶、女性は深紅と茶を基調にし、ただし忍者（飛丸）は夜の甲板に紛れる黒の忍者装束とし、全体的に若く快活な印象で、髪は茶髪と黒髪を風になびくようにまとめ、瞳は茶、青、緑など海を思わせる色合いにし、ヘアスタイルはよきにはからって"
  - id: "detective"
    name: "クラシック探偵"
    summary: "探偵事務所のミステリー、チェック柄とトレンチ風の知的な空気"
    prompt: "使用人は、クラシックな探偵ものをイメージしたデザインで、チェック柄とトレンチコート風の襟、懐中時計のチェーンを意匠に取り入れ、男性は茶と灰、女性は焦げ茶と深緑を基調にし、ただし忍者（飛丸）は路地裏の影らしく灰黒の忍者装束とし、全体的に若く知的な印象で、髪は黒髪と栗色を端正にまとめ、瞳は灰、茶、深青など探るような色合いにし、ヘアスタイルはよきにはからって"
  - id: "magic-academy"
    name: "魔法学校"
    summary: "魔法学校の寄宿舎生活、ローブ風の意匠と星や月の紋様"
    prompt: "使用人は、魔法学校の寄宿舎をイメージしたデザインで、ローブ風の重ね着と星や月の紋様、革表紙の本のような色使いを意匠に取り入れ、男性は深紫と黒、女性は深青と銀を基調にし、ただし忍者（飛丸）は禁じられた塔の影らしく黒の忍者装束とし、全体的に若く好奇心に満ち、髪は黒髪、銀髪、赤毛を散らし、瞳は紫、緑、金など魔法めいた色合いにし、ヘアスタイルはよきにはからって"
  - id: "near-future-sf"
    name: "近未来SF"
    summary: "清潔な近未来ステーション、白とメタリックの機能美"
    prompt: "使用人は、清潔な近未来のステーションをイメージしたデザインで、白とメタリックな素材感、発光ラインを控えめに意匠へ取り入れ、男性は白と青、女性は白と水色を基調にし、ただし忍者（飛丸）は光学迷彩を思わせるマットブラックの忍者装束とし、全体的に若くシャープな印象で、髪は銀髪、白金、黒髪を散らし、瞳は青、水色、紫など透明感のある色合いにし、ヘアスタイルはよきにはからって"
  - id: "cyberpunk"
    name: "サイバーパンク"
    summary: "ネオンの雨の街、黒地に蛍光色が効く電脳的な世界"
    prompt: "使用人は、ネオンに濡れる電脳都市をイメージしたデザインで、黒地の服に蛍光色のラインと透明素材の小物を意匠に取り入れ、男性は黒と電光青、女性は黒とマゼンタを基調にし、ただし忍者（飛丸）はネオンの届かない闇らしく完全な黒の忍者装束とし、全体的に若く鋭い印象で、髪は原色に近い染め分けや銀髪を散らし、瞳は赤、電光青、紫など人工的な色合いにし、ヘアスタイルはよきにはからって"
  - id: "mecha-armor"
    name: "漆黒メカアーマー"
    summary: "漆黒の機械装甲、装飾とアタッチメントの無機質な格好良さ"
    prompt: "使用人は、漆黒の機械装甲をイメージしたデザインで、装甲板のようなパネルラインと関節部の意匠、アタッチメントを制服に取り入れ、男性は黒とガンメタル、女性は黒と深紅の差し色を基調にし、ただし忍者（飛丸）はその中でも最も影に特化した漆黒メカの忍者装束とし、全体的に若く無機質で格好よく、髪は銀髪と黒髪をシャープにまとめ、瞳は赤、水色、金など発光感のある色合いにし、ヘアスタイルはよきにはからって"
  - id: "military-ceremonial"
    name: "儀礼軍装"
    summary: "式典の儀礼服、勲章と金モールで整えた凛とした正装"
    prompt: "使用人は、式典用の儀礼軍装をイメージしたデザインで、詰襟と金モール、勲章風の飾りを意匠に取り入れ、男性は濃紺と金、女性は白と金を基調にし、ただし忍者（飛丸）は儀仗の影らしく黒に金の忍者装束とし、全体的に若く姿勢正しい印象で、髪は黒髪と栗色を端正にまとめ、瞳は黒、茶、深青など規律を感じさせる色合いにし、ヘアスタイルはよきにはからって"
  - id: "ethnic-mix"
    name: "世界民族衣装ミックス"
    summary: "世界の民族衣装を一人ずつ着こなす、博覧会のような多様さ"
    prompt: "使用人は、世界の民族衣装から一人ずつ異なる地域の意匠を取り入れたミックスデザインで、刺繍や織り柄、色使いが全員少しずつ違い、男性と女性で担当する地域が偏らないようにし、ただし忍者（飛丸）はどの地域風でも忍者装束の形を守り、全体的に若く国際色豊かな印象で、髪と瞳の色は各地域の雰囲気に合わせて多様に散らし、ヘアスタイルはよきにはからって"
  - id: "ancient-greece-rome"
    name: "古代ギリシャ・ローマ"
    summary: "大理石の神殿とフォルム、白い重ね布と月桂冠の古典美"

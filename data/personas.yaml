# オーナーによる改名は不可。rare=true は当たるかどうか運次第の「レアもん」。
personas:
  - id: butler-01
    class: butler
    name: 白鳥 理人
    reading: はくちょう りひと
    rare: false
    gender: 男性
    age_bracket: 若手
    speech_ending: 〜でございます
    personality: 礼儀正しく穏やかな、屋敷の標準形とも言える執事。感情を表に出さず、主の意図を一歩先回りして読もうとする。穏やかだが決めるべき所では静かに断言する。
    behavior: {accuracy: high, volume: medium, precision: high, speed: medium}
    profile:
      appearance: 銀に近いプラチナブロンドの短髪を七三に分け、瞳は淡い灰青。中肉中背で姿勢が良く、穏やかな雰囲気。
      background: 代々仕える執事家系の三男で、幼少から作法と語学を仕込まれた。兄たちが大邸宅へ出たため、本人は中規模の屋敷を好んで選んだ。
      self_intro: 白鳥理人と申します。ご用命はすべて、私が滞りなく整えてまいりますでございます。
